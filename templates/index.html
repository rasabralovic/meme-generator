<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Meme generator</h1>
    <div style="display:flex;">
        <div style="padding-left: 200px;">
            {% if meme %}
                <img src="data:image/png;base64,{{ meme }}" style="max-width: 500px; max-height: 500px;">
            {% else %}
                <img src="{{ url_for('static', filename='default_image.jpg') }}" style="max-width: 500px; max-height: 500px;">
            {% endif %}
        </div>
        <div style="padding-left: 200px;">
            <h3>Input tab:</h3>
            <form action="#" method="post" enctype="multipart/form-data">
                <label>Your image:</label>
                <input type="file" name="slika"><br><br><br>
                <label>Top text:</label>
                <input type="text" name="top"><br><br><br>
                <label>Bottom text:</label>
                <input type="text" name="bottom"><br><br><br>
                <input type="submit" value="submit">
            </form>
        </div>
    </div>
</body>
</html>
